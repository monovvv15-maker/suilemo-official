<title>Sweet Lemonade｜リモネン！</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;color:#333}
*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:#fffdf7;overflow-x:hidden}
main{max-width:600px;margin:auto;text-align:center}
.intro{padding:58px 22px 34px;min-height:100svh;display:flex;flex-direction:column;align-items:center}
.wordmark{display:block;width:min(370px,94%);height:auto;margin:0 auto}
.sign{display:block;width:min(184px,48%);height:auto;margin:16px auto 43px}
h1{font-size:clamp(38px,10vw,58px);margin:32px 0 19px}h2{font-size:clamp(20px,5.2vw,26px);font-weight:750;line-height:1.45;margin:0}
.tagline{color:#666;font-size:15px;line-height:1.8;letter-spacing:.025em;margin:0 0 14px}
.panel{width:100%;margin:35px auto;padding:26px 18px;background:#fff;border:1px solid #e8e2d5;border-radius:18px}
.notice{font-weight:700;color:#7a6225}.link{display:inline-block;background:#eee;color:#666;padding:14px 24px;border-radius:28px;text-decoration:none}
.small{font-size:13px;color:#777;line-height:1.8}
footer{margin-top:45px;font-size:12px;color:#777}
/* V15: the last section is the actual end of the document, not a fixed overlay. */
.finale{position:relative;height:clamp(330px,72svh,590px);overflow:hidden;isolation:isolate}
.finale-art{position:absolute;bottom:clamp(24px,4svh,44px);left:clamp(18px,5vw,38px);width:clamp(145px,41vw,205px);max-height:calc(100% - 52px)}
.finale-girl{display:block;width:100%;height:auto;max-height:calc(72svh - 40px);object-fit:contain;object-position:bottom;opacity:.47}
.finale-wink{position:absolute;left:calc(100% + 11px);top:calc(15% - 22px);white-space:nowrap;color:#866749;font:650 clamp(20px,5.3vw,24px)/1.25 system-ui,-apple-system,sans-serif;letter-spacing:.02em;text-shadow:0 1px 2px #fffdf7,0 -1px 2px #fffdf7}
/* V19: the V16 placement remains unchanged. */
/* Without JavaScript the text remains readable, never silently missing. */
.finale-wink{opacity:1;visibility:visible;transform:translateY(0)}
html.js-enabled .finale-wink{opacity:0;visibility:hidden;transform:translateY(0)}
/* Reuse the V18 CSS-only discrete-visibility blink method.
   Animation starts only when the finale scroll trigger fires. */
html.js-enabled .finale.revealed .finale-wink{animation:wink-v21 1.6s .5s steps(1,end) 1 both}
/* Same discrete visibility technique verified on iPhone in V18/V20.
   Two short off intervals, then permanently visible. */
@keyframes wink-v21{
  0%{opacity:0;visibility:hidden}
  1%,12%{opacity:1;visibility:visible}
  13%,25%{opacity:0;visibility:hidden}
  26%,40%{opacity:1;visibility:visible}
  41%,53%{opacity:0;visibility:hidden}
  54%,100%{opacity:1;visibility:visible}
}
@media(max-width:480px){.finale-art{left:14px}.finale-wink{left:calc(100% + 6px)}}
/* Respect explicitly reduced motion while keeping the punchline readable. */
@media(prefers-reduced-motion:reduce){
  html.js-enabled .finale.revealed .finale-wink{animation:none;opacity:1;visibility:visible}
}

.youtube-audio-link{display:inline-block;background:#c90030;color:#fff;padding:14px 24px;border-radius:28px;font-weight:700;margin-top:14px;text-decoration:none}
.youtube-audio-link[hidden]{display:none}
.youtube-pending{opacity:.65;cursor:default}
</style></head><body>

<script>
(function(){
'use strict';
// 2026-11-11 11:11 JSTまでは公開予定を表示。YouTubeの予約公開設定は別途必要。
const releaseAt=Date.parse('2026-11-11T11:11:00+09:00');
const before=document.getElementById('youtube-before-release');
const after=document.getElementById('youtube-after-release');
function updateAudioLink(){
  if(!before||!after)return;
  const released=Date.now()>=releaseAt;
  before.hidden=released;
  after.hidden=!released;
  if(!released)setTimeout(updateAudioLink,Math.min(releaseAt-Date.now()+1000,60000));
}
updateAudioLink();
})();
(function(){
'use strict';
const scene=document.querySelector('.finale');
if(!scene)return;
// Activate JS animation only after all required APIs and elements are available.
if(!('requestAnimationFrame' in window)) return;
document.documentElement.classList.add('js-enabled');
let shown=false;
function reveal(){if(shown)return;shown=true;scene.classList.add('revealed');}
function check(){
  if(shown)return;
  const r=scene.getBoundingClientRect();
  const vh=window.innerHeight||document.documentElement.clientHeight;
  const doc=document.documentElement;
  const maxScroll=Math.max(0, doc.scrollHeight-vh);
  const y=window.scrollY||doc.scrollTop||0;
  // When the end scene is mostly in view or at the true bottom,
  // reveal exactly once. This is independent of swipe speed or device height.
  const sceneNearEnd = r.top <= vh*0.24 && r.bottom >= vh*0.4;
  const atEnd = maxScroll>0 && maxScroll-y <= 24;
  if(sceneNearEnd || atEnd)reveal();
}
window.addEventListener('scroll',check,{passive:true});
window.addEventListener('touchend',check,{passive:true});
window.addEventListener('resize',check,{passive:true});
window.addEventListener('pageshow',check);
// Fallback against unreliable file-preview scroll events.
if('IntersectionObserver' in window){
  const obs=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting && e.intersectionRatio>=.68)){reveal();obs.disconnect();}},{threshold:[.68]});
  obs.observe(scene);
}
check();
})();
